version: '2.4'

services:
  vcs-facade:
    container_name: vcs-facade-ft-vcs-facade
    image: ${OCTOPUS_GITHUB_DOCKER_REGISTRY}/octopusden/vcs-facade:${VCS_FACADE_IMAGE_TAG}
    depends_on:
      bitbucket:
        condition: service_started
      auth-server:
        condition: service_healthy
      valkey:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./application-bitbucket.yml:/application-bitbucket.yml
      - ./../application-vcs-facade.yml:/application-ft.yml
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/
      - SPRING_PROFILES_ACTIVE=ft,bitbucket
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - VCS_FACADE_VCS_HOST=bitbucket:7990
      - DEFERRED_RESULT_VALKEY_HOST=valkey
      - AUTH_SERVER_URL=http://auth-server:8080

  auth-server:
    container_name: vcs-facade-ft-auth-server
    image: ${DOCKER_REGISTRY}/wiremock/wiremock:${WIREMOCK_IMAGE_TAG}
    # Stub of the auth server for provisioning: OIDC discovery, JWKS and userinfo (see ../auth-server/mappings).
    command: ["--local-response-templating"]
    volumes:
      - ./../auth-server/mappings:/home/wiremock/mappings
    healthcheck:
      # bash, not curl: only the TCP port and an HTTP status line are needed, and the image's tools are not relied on.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/ft/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20

  bitbucket:
    container_name: vcs-facade-ft-bitbucket
    image: ${DOCKER_REGISTRY}/atlassian/bitbucket:${BITBUCKET_IMAGE_TAG}
    depends_on:
      bitbucket-db:
        condition: service_started
    ports:
      - "7990:7990"
    environment:
      SETUP_DISPLAYNAME: Bitbucket
      SETUP_BASEURL: http://bitbucket:7990
      SETUP_LICENSE: ${BITBUCKET_LICENSE}
      SETUP_SYSADMIN_USERNAME: admin
      SETUP_SYSADMIN_PASSWORD: admin
      SETUP_SYSADMIN_DISPLAYNAME: Dev Instance Admin
      SETUP_SYSADMIN_EMAILADDRESS: admin@domain.corp
      JDBC_DRIVER: org.postgresql.Driver
      JDBC_USER: bitbucket
      JDBC_PASSWORD: bitbucket
      JDBC_URL: jdbc:postgresql://bitbucket-db:5432/bitbucket
      # Bitbucket 10+ disables basic authentication for REST API calls by default on NEW
      # instances. The test client authenticates with username/password, so without this
      # the first REST call is rejected with HTTP 403 and a non-standard error body.
      JVM_SUPPORT_RECOMMENDED_ARGS: "-Dcom.atlassian.plugins.authentication.basic.auth.filter.force.allow=true"
    healthcheck:
      test: curl -s -f bitbucket:7990/status >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  bitbucket-db:
    container_name: vcs-facade-ft-bitbucket-db
    image: ${DOCKER_REGISTRY}/postgres:${POSTGRES_IMAGE_TAG}
    environment:
      POSTGRES_USER: bitbucket
      POSTGRES_PASSWORD: bitbucket
      POSTGRES_DB: bitbucket

  valkey:
    container_name: vcs-facade-ft-valkey
    image: ${DOCKER_REGISTRY}/valkey/valkey:${VALKEY_IMAGE_TAG}
    ports:
      - "6379:6379"
