version: '2.4'

services:
  vcs-facade:
    container_name: vcs-facade-ft-vcs-facade
    image: ${OCTOPUS_GITHUB_DOCKER_REGISTRY}/octopusden/vcs-facade:${VCS_FACADE_IMAGE_TAG}
    depends_on:
      gitea:
        condition: service_started
      auth-server:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      valkey:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./application-gitea.yml:/application-gitea.yml
      - ./../application-vcs-facade.yml:/application-ft.yml
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/
      - SPRING_PROFILES_ACTIVE=ft,gitea
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - VCS_FACADE_VCS_HOST=gitea:3000
      - VCS_FACADE_OPENSEARCH_HOST=opensearch:9200
      - DEFERRED_RESULT_VALKEY_HOST=valkey
      - AUTH_SERVER_URL=http://auth-server:8080

  auth-server:
    container_name: vcs-facade-ft-auth-server
    image: ${DOCKER_REGISTRY}/wiremock/wiremock:${WIREMOCK_IMAGE_TAG}
    # Stub of the auth server for provisioning: OIDC discovery, JWKS and userinfo (see ../auth-server/mappings).
    command: ["--local-response-templating"]
    volumes:
      - ./../auth-server/mappings:/home/wiremock/mappings
    healthcheck:
      # bash, not curl: only the TCP port and an HTTP status line are needed, and the image's tools are not relied on.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/ft/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20

  gitea:
    image: ${DOCKER_REGISTRY}/gitea/gitea:${GITEA_IMAGE_TAG}
    container_name: vcs-facade-ft-gitea
    environment:
      - "GITEA__server__OFFLINE_MODE=false"
      - "GITEA__security__INSTALL_LOCK=true"
      - "GITEA__webhook__ALLOWED_HOST_LIST=*"
    restart: always
    volumes:
      - ./add_admin.sh:/script/add_admin.sh
    ports:
      - "3000:3000"

  opensearch:
    container_name: vcs-facade-ft-opensearch
    image: ${DOCKER_REGISTRY}/opensearchproject/opensearch:${OPENSEARCH_IMAGE_TAG}
    environment:
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_PASSWORD=admin"
    ports:
      - "9200:9200"
    healthcheck:
      test: curl -s -f opensearch:9200/_cat/health >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5

  valkey:
    container_name: vcs-facade-ft-valkey
    image: ${DOCKER_REGISTRY}/valkey/valkey:${VALKEY_IMAGE_TAG}
    ports:
      - "6379:6379"
