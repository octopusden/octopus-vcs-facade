apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: test-valkey
objects:
- apiVersion: v1
  kind: Pod
  metadata:
    name: ${DEPLOYMENT_PREFIX}-valkey
    labels:
      app.kubernetes.io/name: ${DEPLOYMENT_PREFIX}-valkey
  spec:
    restartPolicy: Never
    activeDeadlineSeconds: ${{ACTIVE_DEADLINE_SECONDS}}
    containers:
      - name: valkey
        image: ${DOCKER_REGISTRY}/valkey/valkey:${VALKEY_IMAGE_TAG}
        ports:
          - containerPort: 6379
            protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 6379
          periodSeconds: 5
- apiVersion: v1
  kind: Service
  metadata:
    name: ${DEPLOYMENT_PREFIX}-valkey-service
  spec:
    ports:
      - port: 6379
        protocol: TCP
        targetPort: 6379
    selector:
      app.kubernetes.io/name: ${DEPLOYMENT_PREFIX}-valkey

parameters:
- description: Unique deployment prefix
  name: DEPLOYMENT_PREFIX
  required: true
- description: Active deadline seconds
  name: ACTIVE_DEADLINE_SECONDS
  required: true
- description: Docker registry
  name: DOCKER_REGISTRY
  required: true
- description: Tag of valkey/valkey image
  name: VALKEY_IMAGE_TAG
  required: true
